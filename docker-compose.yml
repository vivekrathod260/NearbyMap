version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  proximity-service:
    build:
      context: .
      dockerfile: ProximityService/Dockerfile
    container_name: proximity-service
    restart: on-failure
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=BusinessDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - ASPNETCORE_URLS=http://+:8080
      - Kestrel__EndpointDefaults__Protocols=Http2
    depends_on:
      - redis
      - sqlserver

  business-service:
    build:
      context: .
      dockerfile: BusinessService/Dockerfile
    container_name: business-service
    restart: on-failure
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=BusinessDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - ASPNETCORE_URLS=http://+:8080
      - Kestrel__EndpointDefaults__Protocols=Http2
    depends_on:
      - redis
      - sqlserver

  api-gateway:
    build:
      context: .
      dockerfile: APIGateway/Dockerfile
    container_name: api-gateway
    restart: on-failure
    ports:
      - "5000:8080"
    environment:
      - Services__Proximity=http://proximity-service:8080
      - Services__Business=http://business-service:8080
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT=true
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - proximity-service
      - business-service
